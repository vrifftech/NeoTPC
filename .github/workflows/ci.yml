name: CI

on:
  push:
  pull_request:
  repository_dispatch:
    types: [neoshared-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux AppImage (x86-64, Debian 12)
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 90
    env:
      VCPKG_BINARY_SOURCES: clear;default,readwrite
      WX_CONFIG: /usr/bin/wx-config

    steps:
      - name: Install AppImage build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            ninja-build \
            pkg-config \
            python3 \
            tar \
            unzip \
            zip \
            libwxgtk3.2-dev

      - name: Check out NeoTPC
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: main
          path: neoshared
          persist-credentials: false

      - name: Read pinned vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: |
          python3 - <<'PYV' >> "$GITHUB_OUTPUT"
          import json
          with open('tool/vcpkg.json', encoding='utf-8') as manifest_file:
              print(f"sha={json.load(manifest_file)['builtin-baseline']}")
          PYV

      - name: Check out pinned vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg-baseline.outputs.sha }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap vcpkg
        run: bash ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build AppImage
        working-directory: tool
        run: |
          bash ./scripts/build-linux-appimage.sh \
            --neoshared-root ../neoshared \
            --vcpkg-root ../vcpkg \
            --vcpkg-triplet x64-linux \
            --jobs 2 \
            --clean \
            --cmake-arg=-DwxWidgets_CONFIG_EXECUTABLE="$WX_CONFIG"

      - name: Verify AppImage checksum
        run: |
          cd tool/dist
          sha256sum -c NeoTPC-*-linux-x86_64.AppImage.sha256

      - name: Upload Linux AppImage
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: NeoTPC-linux-x86_64-${{ github.sha }}
          path: |
            tool/dist/NeoTPC-*-linux-x86_64.AppImage
            tool/dist/NeoTPC-*-linux-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows (Visual Studio 2026 + wxWidgets 3.3.3)
    runs-on: windows-2025-vs2026
    timeout-minutes: 150
    env:
      VCPKG_BINARY_SOURCES: clear;default,readwrite

    steps:
      - name: Check out NeoTPC
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: main
          path: neoshared
          persist-credentials: false

      - name: Read pinned vcpkg baseline
        id: vcpkg-baseline
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw tool\vcpkg.json | ConvertFrom-Json
          "sha=$($manifest.'builtin-baseline')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out pinned vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg-baseline.outputs.sha }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install wxWidgets 3.3.3
        shell: pwsh
        run: |
          & .\neoshared\scripts\install-wxwidgets.ps1 `
            -VcpkgRoot .\vcpkg `
            -Triplet x64-windows-static `
            -CleanAfterBuild

      - name: Configure and build
        working-directory: tool
        shell: pwsh
        run: |
          .\scripts\build.ps1 `
            -BuildDir build `
            -BuildType Release `
            -Wx ON `
            -RequireWx ON `
            -Cli ON `
            -MinimalRelease OFF `
            -Generator 'Visual Studio 18 2026' `
            -Platform x64 `
            -VcpkgRoot ..\vcpkg `
            -VcpkgTriplet x64-windows-static `
            -Parallel 2 `
            -Clean

      - name: Stage install tree
        shell: pwsh
        run: cmake --install tool/build --config Release --prefix tool/stage

      - name: Upload Windows executable
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: NeoTPC-windows-x86_64-${{ github.sha }}
          path: tool/stage/
          if-no-files-found: error
          retention-days: 14

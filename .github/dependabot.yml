version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
